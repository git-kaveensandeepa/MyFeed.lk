name: Automatic 24/7 News Fetch to Firebase

on:
  schedule:
    # Runs every 6 hours (4 times a day - only uses ~8-12 minutes per day, safely inside GitHub free tier!)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  fetch_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 3 # Hard limit: NEVER let a job run for more than 3 minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install lightweight production dependencies
        run: npm install --omit=dev

      - name: Run automated news fetch & Firebase upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          FACEBOOK_WEBHOOK_URL: ${{ secrets.FACEBOOK_WEBHOOK_URL }}
          PHONE_NOTIFICATION_TOPIC: ${{ secrets.PHONE_NOTIFICATION_TOPIC }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/auto-fetch-news.mjs
