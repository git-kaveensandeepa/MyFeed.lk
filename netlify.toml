[build]
  command = "npm run build"
  publish = "dist/app/browser"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_VERSION = "20"
  NPM_CONFIG_RETRIES = "5"
  NPM_CONFIG_PROGRESS = "false"
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
